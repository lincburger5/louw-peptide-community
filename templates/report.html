{% extends 'base.html' %}{% block title %}Report content{% endblock %}{% block content %}<div class="form-card"><p class="eyebrow">HELP KEEP THIS SPACE RESPECTFUL</p><h1>Report {{ target_type }}</h1><p>A moderator will review your report. Your username is not shown to the person you report.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label for="reason">Reason</label><select id="reason" name="reason" required><option value="">Choose a reason</option>{% for reason in reasons %}<option>{{ reason }}</option>{% endfor %}</select><label for="detail">Details (optional)</label><textarea id="detail" name="detail" maxlength="1000" rows="4"></textarea><div class="form-actions"><button class="btn primary">Submit report</button><a class="btn secondary" href="{{ url_for('index') }}">Cancel</a></div></form></div>{% endblock %}
